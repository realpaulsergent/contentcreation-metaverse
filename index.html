<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CC.Metaverse - Web3 Hub</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b132b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
        }
        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: #4cc9f0;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.95rem;
        }
        nav a:hover {
            color: #4cc9f0;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            font-weight: 700;
        }
        p {
            font-size: 1.15rem;
            color: #adb5bd;
            max-width: 600px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">CC.Metaverse</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
        </nav>
    </header>

    <main>
        <h1>Welcome to the Hub</h1>
        <p>Your decentralized playground is live, automated via GitHub Actions, and securely backed by Nginx on your Bluehost VPS.</p>
    </main>

</body>
</html>
